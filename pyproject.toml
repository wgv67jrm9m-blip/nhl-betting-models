[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nhl-betting-models"
version = "0.1.0"
description = "Shared odds, tracking, validation, and performance infrastructure for pregame NHL models."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"duckdb>=1.1,<2",
	"numpy>=2.0,<3",
	"polars>=1.8,<2",
	"pydantic>=2.9,<3",
    "pytz>=2024.1",
	"scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = [
	"mypy>=1.11,<2",
	"pytest>=8.3,<9",
	"ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nhl_betting_models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nhl_betting_models"]
